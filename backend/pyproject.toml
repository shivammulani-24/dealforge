[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealforge"
version = "0.1.0"
description = "DealForge: M&A valuation and deal intelligence platform (financial engine)"
requires-python = ">=3.12"
dependencies = []  # the engine is pure standard-library Python

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "numpy>=2", "mypy>=1.10", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app/engine"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app/engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # typographic chars allowed; long strings wrapped by formatter

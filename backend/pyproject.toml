[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealforge"
version = "0.1.0"
description = "DealForge: M&A valuation and deal intelligence platform (financial engine)"
requires-python = ">=3.12"
classifiers = ["Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13"]
# The engine (app/engine) uses only the standard library; these serve the API and data layers.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pandas-stubs>=2.2", "pytest>=8", "pytest-cov>=5", "hypothesis>=6", "numpy>=2", "mypy>=1.10", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*", "verification*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "verification"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # typographic chars allowed; long strings wrapped by formatter
